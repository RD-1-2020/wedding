<section
  id="locations"
  class="flex w-full flex-col items-center bg-surface py-section-gap"
  aria-labelledby="locations-heading"
>
  <div class="mx-auto flex w-full max-w-[1200px] flex-col items-center px-4 md:px-8 lg:px-16">
    <h2 id="locations-heading" class="mb-12 text-center font-display text-[2rem] leading-10 font-medium text-primary">
      Локации
    </h2>

    <div
      class="mb-10 grid w-full max-w-4xl grid-cols-1 gap-8 text-center"
      [class.md:grid-cols-2]="locations().length > 1"
    >
      @for (place of locations(); track place.id) {
        <article class="gilt-card p-8">
          <span class="material-symbols-outlined mb-4 text-4xl text-secondary" aria-hidden="true">{{ place.icon }}</span>
          <h3 class="mb-2 font-display text-[1.75rem] leading-9 font-medium text-primary">{{ place.title }}</h3>
          @for (line of place.lines; track line) {
            <p class="font-sans text-lg leading-7 text-on-surface" [innerHTML]="line"></p>
          }
        </article>
      }
    </div>

    <div class="w-full max-w-4xl min-w-0 overflow-hidden rounded-lg border border-powder-pink/20">
      <iframe
        class="block aspect-video h-auto w-full max-w-full"
        [src]="mapSrc()"
        width="1280"
        height="720"
        [attr.frameborder]="'0'"
        title="Карта площадки"
      ></iframe>
    </div>

    <div class="mx-auto mt-12 h-0.5 w-16 bg-real-gold" aria-hidden="true"></div>

    <p class="mx-auto w-full max-w-3xl md:px-16 mt-8 font-sans text-center leading-7 text-on-surface-variant">
      Будем искренне рады видеть вас на нашей свадьбе.
      Ваше присутствие сделает этот праздник незабываемым!
    </p>
  </div>
</section>
