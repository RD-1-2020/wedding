<section
  id="rsvp"
  appMotionReveal
  class="flex w-full flex-col items-center bg-surface-container-low py-section-gap"
  aria-labelledby="rsvp-heading"
>
  <div class="mx-auto w-full max-w-xl px-4">
    <h2 id="rsvp-heading" class="mb-8 text-center font-display text-[2rem] leading-10 font-medium text-primary">
      Подтверждение присутствия
    </h2>

    <mat-card appearance="outlined" class="w-full border-powder-pink/30">
      <mat-card-content>
        <p class="mb-6 font-sans text-base text-on-surface">
          Пожалуйста, подтвердите присутствие не позднее 15 ноября.
        </p>

        <form (submit)="$event.preventDefault(); submit()">
          <div class="rsvp-fields">
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
              <mat-label>Имя</mat-label>
              <input
                matInput
                id="firstName"
                name="firstName"
                autocomplete="given-name"
                [value]="firstName()"
                (input)="onTextInput($event, firstName.set.bind(firstName))"
              />
            </mat-form-field>

            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
              <mat-label>Фамилия</mat-label>
              <input
                matInput
                id="lastName"
                name="lastName"
                autocomplete="family-name"
                [value]="lastName()"
                (input)="onTextInput($event, lastName.set.bind(lastName))"
              />
            </mat-form-field>

            <div class="rsvp-toggle-row">
              <label id="with-partner-label" class="font-sans text-base" for="with-partner">Буду с парой</label>
              <mat-slide-toggle
                id="with-partner"
                aria-labelledby="with-partner-label"
                hideIcon
                [checked]="withPartner()"
                (change)="withPartner.set($event.checked)"
              />
            </div>

            <div class="rsvp-toggle-row">
              <label id="with-child-label" class="font-sans text-base" for="with-child">Буду с ребенком</label>
              <mat-slide-toggle
                id="with-child"
                aria-labelledby="with-child-label"
                hideIcon
                [checked]="withChild()"
                (change)="withChild.set($event.checked)"
              />
            </div>

            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
              <mat-label>Важные детали</mat-label>
              <textarea
                matInput
                id="extraInfo"
                name="extraInfo"
                rows="3"
                [value]="extraInfo()"
                (input)="onTextInput($event, extraInfo.set.bind(extraInfo))"
              ></textarea>
            </mat-form-field>

            <button matButton="filled" type="submit" [disabled]="status() === 'sending'">
              @if (status() === 'sending') {
                Отправляем…
              } @else {
                Отправить
              }
            </button>
          </div>
        </form>

        @if (status() === 'success') {
          <p class="rsvp-feedback rsvp-feedback--ok" role="status">Спасибо! Ваш ответ отправлен.</p>
        }
        @if (status() === 'error') {
          <p class="rsvp-feedback rsvp-feedback--error">Не удалось отправить ответ. Попробуйте ещё раз позже.</p>
        }
      </mat-card-content>
    </mat-card>
  </div>
</section>
