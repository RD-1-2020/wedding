<section
  id="home"
  class="relative isolate flex min-h-[calc(100dvh-4rem)] w-full min-w-0 flex-col overflow-hidden"
  aria-labelledby="hero-heading"
>
  <picture class="absolute inset-0 -z-10 block h-full w-full">
    <source
      media="(min-width: 768px)"
      srcset="/assets/photos/hero-desktop.jpg 1x, /assets/photos/hero-desktop@2x.jpg 2x"
      width="1920"
      height="1080"
    />
    <img
      class="h-full w-full object-cover object-[center_40%]"
      ngSrc="/assets/photos/hero-portrait.jpg"
      srcset="/assets/photos/hero-portrait.jpg 1x, /assets/photos/hero-portrait@2x.jpg 2x"
      width="768"
      height="1024"
      alt="Вероника и Дмитрий — фото пары"
    />
  </picture>

  <div class="hero-vignette" aria-hidden="true"></div>

  <div class="relative z-10 mt-auto w-full px-4 pb-4 lg:px-0 lg:pb-0">
    <div
      class="hero-copy mx-auto flex w-full max-w-6xl flex-col gap-6 px-4 py-5 text-center md:gap-8 md:px-12 md:py-8 lg:flex-row lg:items-end lg:justify-between lg:gap-16 lg:px-16 lg:text-left"
    >
      <div class="flex flex-col items-center lg:items-start">
        <p class="hero-kicker mb-2 font-sans text-sm font-semibold tracking-[0.1em] text-real-gold uppercase">
          Приглашение на свадьбу
        </p>
        <h1 id="hero-heading" class="neon-invitation mb-3 lg:whitespace-nowrap">Вероника и Дмитрий</h1>
        <p class="hero-date mb-3 font-display text-2xl leading-8 font-medium text-real-gold md:text-[2rem] md:leading-10">
          26 декабря 2026
        </p>
        <p class="sr-only">26.12.2026</p>
        <div class="h-px w-24 bg-real-gold/50" aria-hidden="true"></div>
      </div>

      <div class="w-full lg:w-auto" aria-live="polite">
        <p class="hero-kicker mb-4 font-sans text-sm font-semibold tracking-[0.1em] text-surface-bright uppercase opacity-90 lg:text-right">
          До начала праздника
        </p>
        <dl class="flex flex-wrap justify-center gap-3 md:gap-4 lg:justify-end">
          <div class="countdown-tile">
            <dt class="mb-2 font-sans text-xs font-medium tracking-wider text-surface-bright uppercase opacity-90">Дней</dt>
            <dd class="font-display text-[1.75rem] leading-9 font-medium text-real-gold">{{ pad(remaining().days) }}</dd>
          </div>
          <div class="countdown-tile">
            <dt class="mb-2 font-sans text-xs font-medium tracking-wider text-surface-bright uppercase opacity-90">Часов</dt>
            <dd class="font-display text-[1.75rem] leading-9 font-medium text-real-gold">{{ pad(remaining().hours) }}</dd>
          </div>
          <div class="countdown-tile">
            <dt class="mb-2 font-sans text-xs font-medium tracking-wider text-surface-bright uppercase opacity-90">Минут</dt>
            <dd class="font-display text-[1.75rem] leading-9 font-medium text-real-gold">{{ pad(remaining().minutes) }}</dd>
          </div>
          <div class="countdown-tile">
            <dt class="mb-2 font-sans text-xs font-medium tracking-wider text-surface-bright uppercase opacity-90">Секунд</dt>
            <dd class="font-display text-[1.75rem] leading-9 font-medium text-real-gold">{{ pad(remaining().seconds) }}</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</section>
