<section class="bg-background px-4 pb-16 sm:px-6 sm:pb-20" aria-labelledby="schedule-heading">
  <div class="mx-auto w-full max-w-3xl min-w-0">
    <h2 id="schedule-heading" class="text-center font-display text-4xl text-foreground sm:text-5xl">Программа дня</h2>
    <div class="gold-rule mx-auto mt-6 mb-10 w-32"></div>

    <section hlmCard>
      <div hlmCardContent>
        <ol class="space-y-5">
          @for (item of items(); track item.id) {
            <li class="flex items-start gap-4">
              <span class="mt-1 size-3 shrink-0 rounded-full gold-ornament" aria-hidden="true"></span>
              <p class="font-display text-2xl text-card-foreground">{{ item.title }} {{ item.time }}</p>
            </li>
          }
        </ol>
      </div>
      <div hlmCardFooter>
        <a hlmBtn variant="gold" size="lg" [href]="calendarHref()" target="_blank" rel="noopener noreferrer">
          Добавить в Google Календарь
        </a>
      </div>
    </section>
  </div>
</section>
