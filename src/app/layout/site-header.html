<header
  class="sticky top-0 z-50 w-full min-w-0 border-b border-powder-pink/30 bg-surface/90 backdrop-blur-md"
>
  <div
    class="mx-auto flex h-16 w-full max-w-[1200px] items-center justify-between px-4 md:px-8 lg:px-16"
  >
    <a
      href="#home"
      class="font-display text-[1.75rem] leading-9 font-medium text-primary italic"
    >
      V&amp;D
    </a>

    <nav class="hidden h-full items-center gap-6 md:flex" aria-label="Разделы приглашения">
      <a
        class="font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase transition-colors hover:bg-powder-pink/10 hover:text-primary"
        href="#story"
      >
        История
      </a>
      <a
        class="font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase transition-colors hover:bg-powder-pink/10 hover:text-primary"
        href="#program"
      >
        Программа
      </a>
      <a
        class="font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase transition-colors hover:bg-powder-pink/10 hover:text-primary"
        href="#details"
      >
        Детали
      </a>
      <a
        class="font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase transition-colors hover:bg-powder-pink/10 hover:text-primary"
        href="#rsvp"
      >
        RSVP
      </a>
    </nav>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="inline-flex size-11 items-center justify-center rounded-full text-primary hover:bg-powder-pink/20 md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Открыть меню"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span class="material-symbols-outlined text-3xl">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>

      <a
        class="inline-flex size-11 items-center justify-center rounded-full text-primary hover:bg-powder-pink/20"
        [href]="calendarHref()"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Добавить в Google Календарь"
        title="Добавить в Google Календарь"
      >
        <span class="material-symbols-outlined text-3xl">calendar_month</span>
      </a>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-nav"
      class="border-t border-powder-pink/20 px-4 py-3 md:hidden"
      aria-label="Разделы приглашения"
    >
      <ul class="flex flex-col gap-1">
        <li>
          <a class="block py-2 font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase" href="#story" (click)="closeMenu()">История</a>
        </li>
        <li>
          <a class="block py-2 font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase" href="#program" (click)="closeMenu()">Программа</a>
        </li>
        <li>
          <a class="block py-2 font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase" href="#details" (click)="closeMenu()">Детали</a>
        </li>
        <li>
          <a class="block py-2 font-sans text-sm font-semibold tracking-[0.1em] text-on-surface-variant uppercase" href="#rsvp" (click)="closeMenu()">RSVP</a>
        </li>
      </ul>
    </nav>
  }
</header>
